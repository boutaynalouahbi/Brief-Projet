# Configuration SysMonitor Pro

# Chemins
LOG_DIR="logs"
REPORT_DIR="reports"
TEMP_DIR="/tmp/sysmonitor"

# Services critiques à surveiller (inclut réseau et firewall)
CRITICAL_SERVICES=("ssh" "cron" "rsyslog" "NetworkManager" "ufw")

# Intervalles de monitoring (en secondes)
CHECK_INTERVAL=60

# Activation des modules
ENABLE_SYSTEM_MONITOR=true
ENABLE_PROCESS_MONITOR=true
ENABLE_SERVICE_MONITOR=true
ENABLE_NETWORK_MONITOR=true

# Email d'alerte (optionnel)
ALERT_EMAIL=""

# Niveau de log (DEBUG, INFO, WARNING, ERROR, CRITICAL)
LOG_LEVEL="INFO"